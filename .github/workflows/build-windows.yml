name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Liberica "jdk+fx" bundles JavaFX, so jlink/jpackage can include it without Maven.
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          java-package: jdk+fx

      # jpackage on JDK 21 builds .exe installers with WiX Toolset 3.
      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Build
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PromptForger-windows
          path: |
            build/dist/*.zip
            build/dist/*.exe
          if-no-files-found: error
